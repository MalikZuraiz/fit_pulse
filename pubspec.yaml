name: fit_pulse
description: "AI Fitness & Wellness Tracker with modern glassmorphic design."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  get: ^4.6.6
  
  # UI & Animations
  glassmorphism: ^3.0.0
  animate_do: ^3.3.4
  lottie: ^3.1.2
  confetti: ^0.7.0
  shimmer: ^3.0.0
  
  # Charts & Graphs
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.2.11
  
  # Video Player
  video_player: ^2.8.6
  chewie: ^1.8.1
  
  # Icons & Fonts
  google_fonts: ^6.2.1
  iconsax: ^0.0.8
  
  # Storage & Preferences
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # HTTP & Networking
  http: ^1.2.1
  dio: ^5.4.3+1
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/videos/
    - assets/icons/
